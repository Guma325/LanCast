<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>LanCast · Assistindo</title>
<style>
@font-face{font-family:Inter;src:url('/assets/InterVariable.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{color-scheme:dark;--bg:#0a0a12;--surface:#12121c;--raised:#1a1a28;--line:#1e1e2e;--control:#2a2a3e;--text:#f2f2f8;--muted:#a0a0b8;--accent:#6d4aff;--onaccent:#fff;--ok:#3ddc97;--danger:#ff4d6d;--warn:#f5ca7b}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif;user-select:none}
button,input{font:inherit}[hidden]{display:none!important}
button{border:1px solid var(--control);border-radius:10px;background:var(--raised);color:var(--text);padding:0 14px;height:40px;cursor:pointer;font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}button svg{width:16px;height:16px;flex:none}
button:hover{filter:brightness(1.15)}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent);box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 35%,transparent)}
.icon{width:40px;padding:0;justify-content:center}.icon svg{width:18px;height:18px}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar{position:absolute;top:0;left:0;right:0;height:48px;display:flex;align-items:center;gap:8px}
#count{color:var(--muted);font-size:13px;margin-right:auto}
#stage{position:absolute;top:60px;left:0;right:0;bottom:0;display:grid;gap:10px;grid-auto-rows:minmax(0,1fr)}
#stage.focus{grid-auto-rows:0}
#stage.focus .tile.focused{grid-column:1/-1;grid-row:1;order:-1}
#stage.focus .tile:not(.focused) .controls .vol-range,#stage.focus .tile:not(.focused) .vol-value,#stage.focus .tile:not(.focused) .stats-btn{display:none}
.tile{position:relative;min-width:0;min-height:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#07070c}
.tile:fullscreen{border:0;border-radius:0}
.tile.flash{animation:flash 1.2s ease-out}@keyframes flash{0%,40%{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.tile::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.tile.dragging{opacity:.45}
.tile.drop-before::after{box-shadow:inset 4px 0 0 var(--accent)}.tile.drop-after::after{box-shadow:inset -4px 0 0 var(--accent)}.tile.drop-focus::after{box-shadow:inset 0 0 0 3px var(--accent)}
#stage.many video{cursor:grab}#stage.reordering,#stage.reordering *{cursor:grabbing!important;user-select:none}
.split{position:absolute;z-index:5;touch-action:none;outline:none}
.split.v{top:0;bottom:0;width:10px;cursor:col-resize}.split.h{left:0;right:0;height:10px;cursor:row-resize}
.split::after{content:'';position:absolute;inset:0;margin:auto;border-radius:999px;background:var(--accent);opacity:0;transition:opacity .15s}
.split.v::after{width:3px}.split.h::after{height:3px}
.split:hover::after,.split:focus-visible::after,.split.active::after{opacity:1}
@media (prefers-reduced-motion:reduce){.split::after{transition:none}}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#07070c}
.top{position:absolute;top:10px;left:10px;right:10px;display:flex;align-items:center;gap:8px;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:7px;max-width:100%;padding:5px 11px 5px 9px;border-radius:999px;background:#0a0a12cc;color:#f2f2f8;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{font-weight:600;overflow:hidden;text-overflow:ellipsis}.dot{width:7px;height:7px;border-radius:50%;background:#a0a0b8;flex:none}.tile.live .dot{background:var(--ok)}
.viewers{color:#a0a0b8}
.controls{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:12px;background:#0a0a12db;border:1px solid var(--control);opacity:0;transition:opacity .18s ease-out}
@media (prefers-reduced-motion:reduce){.controls{transition:none}}
.tile:hover .controls,.tile:focus-within .controls{opacity:1}
.controls button{background:transparent;border-color:transparent;color:#f2f2f8}.controls button:hover{background:#ffffff1f;filter:none}
.controls .spacer{flex:1}
.vol-range{-webkit-appearance:none;appearance:none;width:96px;height:4px;margin:0 6px;border-radius:999px;cursor:pointer;outline-offset:6px;background:linear-gradient(to right,var(--accent) var(--v,80%),var(--control) var(--v,80%))}
.vol-range::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:transparent}
.vol-range::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border:0;border-radius:50%;background:#f2f2f8;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent);transition:transform .15s ease-out}
.vol-range:hover::-webkit-slider-thumb,.vol-range:focus-visible::-webkit-slider-thumb{transform:scale(1.2)}
.vol-value{font:12px 'Cascadia Mono',Consolas,monospace;color:var(--muted);min-width:38px}
.hud{position:absolute;top:48px;left:10px;padding:12px;border-radius:12px;background:#12121ced;border:1px solid var(--control);color:#f2f2f8;font:12px 'Cascadia Mono',Consolas,monospace;line-height:1.7;white-space:pre-line;pointer-events:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:#07070ce6;color:#f2f2f8;text-align:center}
.card{max-width:340px;display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px;border-radius:14px;background:var(--surface);border:1px solid var(--control)}
.card h3{margin:0;font-size:16px;font-weight:600}.card p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.card input{width:220px;height:40px;border:1px solid var(--control);background:var(--bg);color:var(--text);border-radius:10px;padding:0 12px}
.spin{width:28px;height:28px;border:3px solid #ffffff26;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.err{color:var(--danger)!important}
#empty{position:absolute;inset:60px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);text-align:center}
#empty b{color:var(--text);font-size:18px;font-weight:600}
#toast{position:fixed;right:16px;bottom:16px;max-width:420px;padding:12px 16px;border-radius:10px;background:var(--raised);border:1px solid var(--control);font-size:13px;box-shadow:0 8px 24px #0006}
</style></head><body>
<div class="bar"><span id="count"></span><button id="addStream" class="primary" title="Escolha outra transmissão em Streams salvas para assistir lado a lado"></button><button id="popout"></button><button id="closeAll">Sair de todas</button></div>
<main id="stage"></main>
<div id="empty"><b>Nenhuma transmissão aberta</b><span>Em Streams salvas, clique em Assistir para abrir uma transmissão aqui.</span></div>
<div id="toast" role="status" hidden></div>
<script>
const $=id=>document.getElementById(id),stage=$('stage'),webview=window.chrome&&window.chrome.webview;
const ICON={
 vol:'<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
 muted:'<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6M22 9l-6 6"/></svg>',
 stats:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
 focus:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="12" rx="2"/><path d="M3 19h4M10 19h4M17 19h4"/></svg>',
 grid:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>',
 full:'<svg viewBox="0 0 24 24"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/></svg>',
 close:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
 popout:'<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
 add:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
 dock:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>'};
const tiles=new Map();let focused=null,popped=false,toastTimer;

// ---- ponte com o LanCast (C#): pedidos com resposta (req) e eventos ----
let seq=0;const pending=new Map();
function post(m){webview&&webview.postMessage(m)}
function call(method,data){return new Promise(resolve=>{const req=++seq;pending.set(req,resolve);post({req,method,...data});setTimeout(()=>{if(pending.delete(req))resolve({ok:false,status:0,error:'O LanCast não respondeu.'})},20000)})}
webview&&webview.addEventListener('message',e=>{const m=e.data||{};
 if(m.req){const done=pending.get(m.req);if(done){pending.delete(m.req);done(m)}return}
 switch(m.cmd){
  case 'add':{const t=tiles.get(m.stream.id);if(t){t.rename(m.stream.name);t.flash()}else{tiles.set(m.stream.id,new Tile(m.stream));layout()}break}
  case 'closeAll':[...tiles.values()].forEach(t=>t.close());break;
  case 'theme':for(const[k,v]of Object.entries(m.vars||{}))document.documentElement.style.setProperty('--'+k,v);document.documentElement.style.colorScheme=m.dark?'dark':'light';break;
  case 'popped':popped=!!m.value;popoutButton();break;
  case 'toast':toast(m.text);break;
 }});

function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4000)}
function popoutButton(){$('popout').innerHTML=(popped?ICON.dock+'Voltar para o LanCast':ICON.popout+'Abrir em janela');$('popout').title=popped?'Volta a exibir as transmissões dentro do LanCast':'Abre as transmissões numa janela separada (bom para um segundo monitor)'}
$('addStream').innerHTML=ICON.add+'Adicionar transmissão';$('addStream').onclick=()=>post({event:'pick'});
$('popout').onclick=()=>post({event:popped?'dock':'popout'});
$('closeAll').onclick=()=>[...tiles.values()].forEach(t=>t.close());
function setFocus(id){focused=focused===id?null:id;layout()}

// ---- grade: ordem (CSS order, sem mover o <video>) e tamanhos (divisórias arrastáveis) ----
const GAP=10;let order=[],colFr=[],rowFr=[],strip=22,handles=[];
const frs=a=>a.map(f=>`minmax(0,${f}fr)`).join(' ');
function applyGrid(){
 const n=tiles.size;
 stage.style.gridTemplateColumns=focused?`repeat(${n-1},minmax(0,1fr))`:frs(colFr);
 stage.style.gridTemplateRows=focused?`minmax(0,1fr) ${strip}%`:frs(rowFr);
 handles.forEach(h=>h.el.style[h.dir==='v'?'left':'top']=h.pos());
}
// posição (borda esquerda/superior da divisória de 10px) no meio do vão depois da faixa i
const edge=(arr,i)=>{const sum=arr.reduce((a,b)=>a+b),cum=arr.slice(0,i+1).reduce((a,b)=>a+b)/sum;return `calc((100% - ${GAP*(arr.length-1)}px) * ${cum} + ${GAP*i}px)`};
function resizeTracks(arr,i,dpx,size){
 const sum=arr.reduce((a,b)=>a+b),min=sum*.15;
 const d=Math.max(min-arr[i],Math.min(arr[i+1]-min,dpx/(size-GAP*(arr.length-1))*sum));
 arr[i]+=d;arr[i+1]-=d;applyGrid();
}
function splitter(dir,label,pos,drag,reset){
 const el=document.createElement('div');el.className='split '+dir;el.tabIndex=0;
 el.setAttribute('role','separator');el.setAttribute('aria-orientation',dir==='v'?'vertical':'horizontal');el.setAttribute('aria-label',label);
 el.title=label+' · duplo clique volta ao padrão';
 el.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();el.setPointerCapture(e.pointerId);el.classList.add('active');let last=dir==='v'?e.clientX:e.clientY;
  el.onpointermove=m=>{const p=dir==='v'?m.clientX:m.clientY;drag(p-last);last=p};
  el.onpointerup=el.onpointercancel=()=>{el.onpointermove=null;el.classList.remove('active')}};
 el.ondblclick=()=>{reset();applyGrid()};
 el.onkeydown=e=>{const k={ArrowLeft:-1,ArrowUp:-1,ArrowRight:1,ArrowDown:1}[e.key];if(k){e.preventDefault();drag(k*24)}};
 stage.append(el);handles.push({el,dir,pos});
}
function splitters(cols,rows){
 handles.forEach(h=>h.el.remove());handles=[];
 if(tiles.size<2)return;
 if(focused){splitter('h','Altura da faixa de baixo',()=>`calc(${100-strip}% - ${GAP}px)`,
  d=>{strip=Math.max(12,Math.min(50,strip-d/stage.clientHeight*100));applyGrid()},()=>strip=22);return}
 for(let i=0;i<cols-1;i++)splitter('v','Largura das colunas',()=>edge(colFr,i),d=>resizeTracks(colFr,i,d,stage.clientWidth),()=>colFr.fill(1));
 for(let i=0;i<rows-1;i++)splitter('h','Altura das linhas',()=>edge(rowFr,i),d=>resizeTracks(rowFr,i,d,stage.clientHeight),()=>rowFr.fill(1));
}
function moveTile(id,ref,after){
 order.splice(order.indexOf(id),1);order.splice(order.indexOf(ref)+(after?1:0),0,id);layout();
}
// arrastar o vídeo de uma transmissão para outra posição; soltar sobre a destacada troca o destaque
function dragTile(t,e){
 if(e.button!==0||tiles.size<2||e.target.closest('.controls,.overlay,.hud'))return;
 const x0=e.clientX,y0=e.clientY;let on=false,target=null,cls='';
 const mark=(next,c)=>{if(target===next&&cls===c)return;if(cls)target.el.classList.remove(cls);target=next;cls=c;if(cls)target.el.classList.add(cls)};
 const move=m=>{
  if(!on){if(Math.hypot(m.clientX-x0,m.clientY-y0)<6)return;on=true;t.el.classList.add('dragging');stage.classList.add('reordering')}
  const hit=document.elementFromPoint(m.clientX,m.clientY)?.closest('.tile');
  const next=hit&&hit!==t.el?[...tiles.values()].find(o=>o.el===hit):null;
  if(!next)return mark(null,'');
  const r=hit.getBoundingClientRect();
  mark(next,next.id===focused?'drop-focus':m.clientX>r.left+r.width/2?'drop-after':'drop-before');
 };
 const up=()=>{
  removeEventListener('pointermove',move);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
  if(!on)return;
  t.el.classList.remove('dragging');stage.classList.remove('reordering');
  const drop=target,c=cls;mark(null,'');
  if(!drop)return;
  if(c==='drop-focus')setFocus(t.id);else moveTile(t.id,drop.id,c==='drop-after');
 };
 addEventListener('pointermove',move);addEventListener('pointerup',up);addEventListener('pointercancel',up);
}

function layout(){
 const n=tiles.size;if(focused&&(!tiles.has(focused)||n<2))focused=null;
 order=order.filter(id=>tiles.has(id));for(const id of tiles.keys())if(!order.includes(id))order.push(id);
 const cols=n<=1?1:n<=4?2:3,rows=Math.max(1,Math.ceil(n/cols));
 if(colFr.length!==cols)colFr=Array(cols).fill(1);
 if(rowFr.length!==rows)rowFr=Array(rows).fill(1);
 order.forEach((id,i)=>tiles.get(id).el.style.order=id===focused?-1:i);
 stage.classList.toggle('focus',!!focused);stage.classList.toggle('many',n>1);
 splitters(cols,rows);applyGrid();
 for(const t of tiles.values()){t.el.classList.toggle('focused',t.id===focused);t.focusBtn.innerHTML=t.id===focused?ICON.grid:ICON.focus;const tip=t.id===focused?'Voltar para a grade':'Destacar esta transmissão';t.focusBtn.title=tip;t.focusBtn.setAttribute('aria-label',tip);t.focusBtn.hidden=n<2}
 $('count').textContent=n===1?'1 transmissão':n+' transmissões';
 $('empty').hidden=n>0;$('closeAll').hidden=n===0;
}

function button(cls,html,label,onclick){const b=document.createElement('button');b.className=cls;b.innerHTML=html;if(label){b.title=label;b.setAttribute('aria-label',label)}b.onclick=e=>{e.stopPropagation();onclick()};return b}

class Tile{
 constructor(s){
  this.id=s.id;this.name=s.name;this.password='';this.gen=0;this.attempts=0;this.last={};
  const el=this.el=document.createElement('section');el.className='tile';el.tabIndex=-1;
  this.v=document.createElement('video');this.v.autoplay=true;this.v.playsInline=true;
  let vol=.8;try{const saved=parseFloat(localStorage.getItem('vol-'+this.id));if(saved>=0&&saved<=1)vol=saved}catch{}
  this.v.volume=vol;this.lastVolume=vol||.8;
  this.v.ondblclick=()=>{if(tiles.size>1)setFocus(this.id);else this.fullscreen()};
  el.onpointerdown=e=>dragTile(this,e);
  // Alt+←/→ move a transmissão na grade pelo teclado
  el.addEventListener('keydown',e=>{const k={ArrowLeft:-1,ArrowRight:1}[e.key];if(!e.altKey||!k)return;e.preventDefault();
   const i=order.indexOf(this.id),j=i+k;if(j<0||j>=order.length)return;moveTile(this.id,order[j],k>0)});
  const top=document.createElement('div');top.className='top';
  this.chip=document.createElement('span');this.chip.className='chip';this.chip.innerHTML='<span class="dot"></span><b></b><span class="viewers"></span>';top.append(this.chip);
  this.hud=document.createElement('div');this.hud.className='hud';this.hud.hidden=true;
  this.overlay=document.createElement('div');this.overlay.className='overlay';
  const c=document.createElement('div');c.className='controls';
  this.muteBtn=button('icon',ICON.vol,'Silenciar',()=>this.toggleMute());
  this.range=document.createElement('input');this.range.type='range';this.range.min=0;this.range.max=1;this.range.step=.01;this.range.className='vol-range';this.range.setAttribute('aria-label','Volume de '+this.name);
  this.range.oninput=()=>{this.v.volume=+this.range.value;this.v.muted=false;if(this.v.volume>0)this.lastVolume=this.v.volume;this.volumeUI()};
  this.volValue=document.createElement('span');this.volValue.className='vol-value';
  const spacer=document.createElement('span');spacer.className='spacer';
  const stats=button('icon stats-btn',ICON.stats,'Estatísticas',()=>{this.hud.hidden=!this.hud.hidden;this.stats()});
  this.focusBtn=button('icon',ICON.focus,'Destacar esta transmissão',()=>setFocus(this.id));
  const full=button('icon',ICON.full,'Tela cheia',()=>this.fullscreen());
  const close=button('icon',ICON.close,'Fechar esta transmissão',()=>this.close());
  c.append(this.muteBtn,this.range,this.volValue,spacer,stats,this.focusBtn,full,close);
  el.append(this.v,top,this.hud,c,this.overlay);stage.append(el);
  this.rename(s.name);this.volumeUI();this.connect();
 }
 flash(){this.el.classList.remove('flash');void this.el.offsetWidth;this.el.classList.add('flash')}
 rename(name){this.name=name;this.chip.querySelector('b').textContent=name;this.range.setAttribute('aria-label','Volume de '+name)}
 volumeUI(){const silent=this.v.muted||this.v.volume===0;this.muteBtn.innerHTML=silent?ICON.muted:ICON.vol;const tip=silent?'Ativar o áudio':'Silenciar';this.muteBtn.title=tip;this.muteBtn.setAttribute('aria-label',tip);const value=this.v.muted?0:this.v.volume;this.range.value=value;this.range.style.setProperty('--v',value*100+'%');this.volValue.textContent=Math.round(value*100)+'%';try{localStorage.setItem('vol-'+this.id,String(value))}catch{}}
 toggleMute(){if(this.v.muted||this.v.volume===0){this.v.muted=false;this.v.volume=this.lastVolume||.8;this.v.play().catch(()=>{})}else{this.lastVolume=this.v.volume;this.v.muted=true}this.volumeUI()}
 fullscreen(){(document.fullscreenElement?document.exitFullscreen():this.el.requestFullscreen()).catch(()=>{})}
 // estados sobre o vídeo: connecting | reconnecting | lost | password | banned | null (ao vivo)
 show(state,message=''){
  const o=this.overlay;o.hidden=!state;o.textContent='';if(!state)return;
  const card=document.createElement('div');card.className='card';o.append(card);
  const h=t=>{const e=document.createElement('h3');e.textContent=t;card.append(e)},p=(t,err)=>{if(!t)return;const e=document.createElement('p');e.textContent=t;if(err)e.className='err';card.append(e)};
  const row=(...b)=>{const r=document.createElement('div');r.className='row';r.append(...b);card.append(r)};
  const closeBtn=()=>button('', 'Fechar',null,()=>this.close());
  if(state==='connecting'||state==='reconnecting'){const s=document.createElement('div');s.className='spin';card.append(s);h(state==='connecting'?'Conectando a '+this.name+'…':'Reconectando…');p(message);if(state==='reconnecting')row(closeBtn())}
  else if(state==='lost'){h('Conexão interrompida');p(message||'A transmissão pode ter sido encerrada ou a conexão caiu.');row(button('primary','Reconectar',null,()=>{this.attempts=0;this.connect()}),closeBtn())}
  else if(state==='banned'){h('Sem acesso');p('Seu IP foi banido desta transmissão. Fale com o anfitrião.');row(closeBtn())}
  else if(state==='password'){h(this.name+' usa senha');p(message||'Digite a senha do anfitrião para assistir.',!!message);
   const form=document.createElement('form');form.className='card';const input=document.createElement('input');input.type='password';input.placeholder='Senha';input.setAttribute('aria-label','Senha da transmissão');
   const go=document.createElement('button');go.className='primary';go.type='submit';go.textContent='Entrar';
   form.onsubmit=e=>{e.preventDefault();this.password=input.value;this.attempts=0;this.connect()};
   const r=document.createElement('div');r.className='row';r.append(go,closeBtn());form.append(input,r);card.append(form);setTimeout(()=>input.focus(),0)}
 }
 teardown(){
  this.gen++;clearTimeout(this.connectTimer);clearTimeout(this.retryTimer);clearInterval(this.statsTimer);clearInterval(this.viewersTimer);
  if(this.pc){const pc=this.pc;this.pc=null;pc.onconnectionstatechange=null;pc.ontrack=null;pc.onicegatheringstatechange=null;pc.close()}
  this.v.srcObject=null;this.last={};this.el.classList.remove('live');
 }
 async connect(){
  this.teardown();const token=this.gen;this.show(this.attempts?'reconnecting':'connecting');
  try{
   const pc=this.pc=new RTCPeerConnection({iceServers:[]}),stream=new MediaStream();this.v.srcObject=stream;
   pc.ontrack=e=>{if(token!==this.gen)return;stream.addTrack(e.track);try{e.receiver.jitterBufferTarget=0;e.receiver.playoutDelayHint=0}catch{}};
   pc.addTransceiver('video',{direction:'recvonly'});pc.addTransceiver('audio',{direction:'recvonly'});
   pc.onconnectionstatechange=()=>{if(token!==this.gen)return;const s=pc.connectionState;if(s==='connected')this.live();else if(s==='failed'||s==='disconnected'||s==='closed')this.lost()};
   const offer=await pc.createOffer();offer.sdp=offer.sdp.replace(/(a=fmtp:\d+ [^\r\n]*useinbandfec=1)/,'$1;stereo=1;sprop-stereo=1');await pc.setLocalDescription(offer);
   await new Promise(resolve=>{if(pc.iceGatheringState==='complete')return resolve();pc.onicegatheringstatechange=()=>{if(pc.iceGatheringState==='complete')resolve()};setTimeout(resolve,1500)});
   if(token!==this.gen)return;
   const r=await call('offer',{id:this.id,sdp:pc.localDescription.sdp,password:this.password});
   if(token!==this.gen)return;
   if(r.status===401){const wrong=!!this.password;this.teardown();this.show('password',wrong?'Senha incorreta. Confira com o anfitrião.':'');return}
   if(r.status===403){this.teardown();this.show('banned');return}
   if(!r.ok)throw new Error(r.error||'O anfitrião não respondeu.');
   await pc.setRemoteDescription({type:'answer',sdp:r.body.sdp});
   if(pc.connectionState!=='connected')this.connectTimer=setTimeout(()=>{if(token===this.gen)this.lost('Tempo de conexão esgotado.')},15000);
  }catch(error){if(token===this.gen)this.lost(error.message)}
 }
 live(){
  clearTimeout(this.connectTimer);this.attempts=0;this.el.classList.add('live');this.show(null);
  this.v.play().catch(()=>{});
  clearInterval(this.statsTimer);clearInterval(this.viewersTimer);
  this.statsTimer=setInterval(()=>this.stats(),1000);this.viewers();this.viewersTimer=setInterval(()=>this.viewers(),3000);
 }
 lost(message){
  this.teardown();
  // tenta sozinho algumas vezes (o anfitrião pode ter só reiniciado); depois deixa o botão Reconectar
  if(++this.attempts<=5){this.show('reconnecting',message||'');this.retryTimer=setTimeout(()=>this.connect(),3000)}
  else this.show('lost',message);
 }
 close(){
  this.teardown();this.el.remove();tiles.delete(this.id);
  if(document.fullscreenElement===this.el)document.exitFullscreen().catch(()=>{});
  post({event:'closed',id:this.id});layout();
 }
 async viewers(){const token=this.gen;const r=await call('viewers',{id:this.id});if(token!==this.gen||!r.ok)return;const n=r.body.count||0,names=r.body.names||[];const e=this.chip.querySelector('.viewers');e.textContent='· '+n+' assistindo';this.chip.title=names.join(', ')}
 async stats(){
  const pc=this.pc,token=this.gen;if(this.hud.hidden||!pc||pc.connectionState!=='connected')return;
  try{const report=await pc.getStats();if(token!==this.gen)return;const lines=[];
   report.forEach(s=>{
    if(s.type==='inbound-rtp'&&(s.kind==='video'||s.mediaType==='video')){const dt=this.last.t?(s.timestamp-this.last.t)/1000:0,kbps=dt>0?Math.max(0,Math.round(((s.bytesReceived||0)-this.last.b)*8/1000/dt)):0,buffer=s.jitterBufferEmittedCount?Math.round(s.jitterBufferDelay/s.jitterBufferEmittedCount*1000):0;
     lines.push(`Resolução: ${s.frameWidth||0} × ${s.frameHeight||0}`,`Quadros: ${s.framesPerSecond||0} fps · ${kbps} kbps`,`Buffer: ${buffer} ms · Perdidos: ${s.packetsLost||0}`);this.last={t:s.timestamp,b:s.bytesReceived||0}}
    if(s.type==='candidate-pair'&&s.state==='succeeded'&&s.currentRoundTripTime!=null)lines.push(`Latência de rede: ${Math.round(s.currentRoundTripTime*1000)} ms`)});
   this.hud.textContent=lines.join('\n')||'Aguardando estatísticas…'}catch{}
 }
}
popoutButton();layout();post({event:'ready'});
</script></body></html>
